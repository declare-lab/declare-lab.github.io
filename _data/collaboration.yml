scope: "Publication archive, 2019 onward"
total_papers: 167
method_note: "Percentages summarize papers from 2019 onward; DeCLaRe members include current members and alumni. Internal collaboration excludes the PI."
# One entry per edge in the collaboration map. The legend beside the map is
# generated from this list and keyed by `id`, so a relationship cannot appear
# in one and not the other. `nodes` names the two circles an edge lights up.
edges:
  - id: "intra"
    label: "Internal collaboration"
    nodes: "internal archive"
    percent: "49.1%"
    count: "82 of 167 papers"
    detail: "At least two non-PI DeCLaRe members appear on the same paper. Current members and alumni both count."
  - id: "pi"
    label: "Initiated in DeCLaRe"
    nodes: "pi archive"
    percent: "84.4%"
    count: "141 of 167 papers"
    detail: "The first author is a DeCLaRe member, or the PI is first, second, or last author."
  - id: "external"
    label: "External collaborators"
    nodes: "archive external"
    percent: "89.8%"
    count: "150 of 167 papers"
    detail: "Most papers connect DeCLaRe members to research networks beyond the lab."
  - id: "theme"
    label: "Crosses research themes"
    nodes: "archive theme"
    percent: "70.1%"
    count: "117 of 167 papers"
    detail: "The paper draws on more than one of the lab's six research themes."
  - id: "academic"
    label: "Academic partners"
    nodes: "external academic"
    percent: "98.0%"
    count: "147 of 150 external papers"
    detail: "Of the externally collaborative papers, nearly all involve academic or public-research partners."
  - id: "industry"
    label: "Industry partners"
    nodes: "external industry"
    percent: "21.3%"
    count: "32 of 150 external papers"
    detail: "Roughly a fifth of externally collaborative papers involve an industry partner. Mixed academic-industry papers count here."
